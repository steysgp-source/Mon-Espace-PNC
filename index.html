<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon espace PNC</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f1f4fa;--card:#fff;--ink:#16213e;--muted:#6b7280;--accent:#3a6fd8;--line:#e5e9f2;--mep:#7c3aed;--chip:#eef3ff}
@media (prefers-color-scheme: dark){:root{--bg:#0f1420;--card:#1a2233;--ink:#eef2ff;--muted:#9aa4bd;--accent:#6b9cff;--line:#2a3550;--mep:#a78bfa;--chip:#222d46}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
main{max-width:520px;margin:0 auto;padding:24px 16px 40px}
h1{text-align:center;font-size:22px;letter-spacing:.5px;margin:8px 0 20px}
.hero{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:600;text-align:center}
.date{font-size:14px;color:var(--muted);text-align:center;margin:2px 0 14px}
.act{font-size:30px;font-weight:800;color:var(--accent);text-align:center}
.detail{font-size:17px;text-align:center;margin-top:6px}
.line{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:16px}
.line.mep{color:var(--mep);font-weight:600}
.next{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.small{background:var(--card);border-radius:14px;padding:12px;font-size:14px;text-align:center}
.small b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;letter-spacing:.08em}
.small span{font-size:16px;font-weight:700}
button{font:inherit;border:0;border-radius:14px;padding:14px;width:100%;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;margin-top:16px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
.err{color:#c0392b;font-size:14px;margin-top:12px;white-space:pre-wrap}
pre{text-align:left;white-space:pre-wrap;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>MON ESPACE PNC</h1>
  <button id="btn" onclick="connecter()">Se connecter à Google</button>
  <div id="err" class="err"></div>

  <div id="accueil" hidden>
    <section class="hero" id="hero"></section>
    <div class="next" id="suivants"></div>
    <div class="foot" id="maj"></div>
    <details class="foot">
      <summary>Valeurs brutes (aujourd'hui)</summary>
      <pre id="raw"></pre>
    </details>
  </div>
</main>

<script>
const CONFIG = {
  CLIENT_ID: "997949925649-tc91o21cmtut71cd4isr9na7oine733d.apps.googleusercontent.com",
  PLANNING_ID: "1rO-X1H546RAPFKf140vnJdOuCIHCGkVyuxYAQiGeGug",
  SCOPE: "https://www.googleapis.com/auth/spreadsheets.readonly"
};

const MOIS = ["JANVIER","FEVRIER","MARS","AVRIL","MAI","JUIN","JUILLET","AOUT","SEPTEMBRE","OCTOBRE","NOVEMBRE","DECEMBRE"];
let token = null, tokenClient = null, gsiPret = false;

const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/\s+/g, " ").trim();
const colIdx = L => L.charCodeAt(0) - 65;
const cellule = (ligne, L) => (ligne && ligne[colIdx(L)] != null ? String(ligne[colIdx(L)]).trim() : "");
const ddmm = d => String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0");

window.addEventListener("load", () => {
  const attendre = () => {
    if (window.google && google.accounts && google.accounts.oauth2) {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CONFIG.CLIENT_ID,
        scope: CONFIG.SCOPE,
        callback: (r) => {
          if (r.error) return afficherErreur("Connexion refusée : " + r.error);
          token = r.access_token;
          document.getElementById("btn").hidden = true;
          charger();
        }
      });
      gsiPret = true;
    } else {
      setTimeout(attendre, 200);
    }
  };
  attendre();
});

function connecter() {
  if (!gsiPret) return afficherErreur("Google n'est pas encore chargé, réessaie dans un instant.");
  tokenClient.requestAccessToken();
}

function afficherErreur(msg) {
  document.getElementById("err").textContent = msg;
}

async function api(url) {
  const r = await fetch(url, { headers: { Authorization: "Bearer " + token } });
  if (r.status === 401) {
    token = null;
    document.getElementById("btn").hidden = false;
    throw new Error("Session expirée : reconnecte-toi.");
  }
  if (!r.ok) throw new Error("Erreur Google " + r.status + " : " + (await r.text()).slice(0, 300));
  return r.json();
}

function dates3() {
  const base = new Date();
  base.setHours(0, 0, 0, 0);
  return [0, 1, 2].map(i => { const d = new Date(base); d.setDate(base.getDate() + i); return d; });
}

function lireJour(d, ligne) {
  if (!ligne) return { date: d, type: "?", introuvable: true };
  const type = cellule(ligne, "B").toUpperCase();
  const debut = cellule(ligne, "D");
  const fin = cellule(ligne, "J");
  const etapes = ["E", "F", "G", "H", "I"].map(L => cellule(ligne, L)).join(" ").toUpperCase();
  const codes = etapes.match(/\b[A-Z]{3}\b/g) || [];
  const trajet = (type === "VOL" && codes.length >= 2) ? { dep: codes[0], arr: codes[codes.length - 1] } : null;
  const decouche = cellule(ligne, "K");
  // MEP : colonnes I à M, branchées plus tard (lecture des mails)
  return { date: d, type, debut, fin, trajet, decouche, mepAller: null, mepRetour: null };
}

function blocJour(j) {
  const aller = j.mepAller ? `<div class="line mep">🛫 MEP aller · ${j.mepAller.heure}</div>` : "";
  const retour = j.mepRetour ? `<div class="line mep">🛬 MEP retour · ${j.mepRetour.heure}</div>` : "";
  const decouche = j.decouche ? `<div class="line">🛌 Découché ${j.decouche}</div>` : "";
  const horaires = [j.debut, j.fin].filter(Boolean).join(" → ");
  const trajet = j.trajet ? `${j.trajet.dep} → ${j.trajet.arr}` : "";
  const detail = [horaires, trajet].filter(Boolean).join(" · ");

  if (j.introuvable) return `<div class="detail">Jour introuvable dans le planning</div>`;

  if (j.type === "OFF") {
    return retour + `<div class="act">OFF</div>` + aller + decouche;
  }
  return aller
    + `<div class="act">${j.type || "—"}</div>`
    + (detail ? `<div class="detail">${detail}</div>` : "")
    + decouche
    + retour;
}

function carteSuivante(j) {
  const nom = j.date.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "short" });
  return `<div class="small"><b>${nom.toUpperCase()}</b><span>${j.type || "—"}</span></div>`;
}

async function charger() {
  try {
    afficherErreur("");
    const meta = await api(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.PLANNING_ID}?fields=sheets.properties.title`);
    const onglets = meta.sheets.map(s => s.properties.title);
    const jours = dates3();
    const cache = {};
    const lus = [];
    let brutAujourdhui = "";

    for (const d of jours) {
      const cible = norm(`${MOIS[d.getMonth()]} ${d.getFullYear()}`);
      const nom = onglets.find(t => norm(t) === cible);
      if (!nom) throw new Error(`Onglet introuvable pour ${cible}. Onglets présents : ${onglets.join(", ")}`);

      if (!cache[nom]) {
        const plage = encodeURIComponent(`'${nom}'!A1:K40`);
        const v = await api(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.PLANNING_ID}/values/${plage}`);
        cache[nom] = v.values || [];
      }

      const ligne = cache[nom].find(r => {
        const m = cellule(r, "A").match(/^(\d{1,2})\/(\d{1,2})/);
        return m && ddmm(d) === String(m[1]).padStart(2, "0") + "/" + String(m[2]).padStart(2, "0");
      });

      if (d.getTime() === jours[0].getTime()) {
        brutAujourdhui = ligne ? JSON.stringify(ligne, null, 1) : "Aucune ligne trouvée pour " + ddmm(d);
      }
      lus.push(lireJour(d, ligne));
    }

    const [aujourdhui, ...suivants] = lus;
    const jourLabel = aujourdhui.date.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });

    document.getElementById("hero").innerHTML =
      `<div class="label">AUJOURD'HUI</div>
       <div class="date">${jourLabel}</div>
       ${blocJour(aujourdhui)}`;
    document.getElementById("suivants").innerHTML = suivants.map(carteSuivante).join("");
    document.getElementById("raw").textContent = brutAujourdhui;
    document.getElementById("maj").textContent =
      "Lu à " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    document.getElementById("accueil").hidden = false;
  } catch (e) {
    afficherErreur(e.message);
  }
}
</script>
</body>
</html>
